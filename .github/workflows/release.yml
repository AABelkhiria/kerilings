name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  supply-chain:
    name: Supply chain
    uses: ./.github/workflows/supply-chain.yml

  verify:
    name: Verify release candidate
    needs: supply-chain
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # read the Check workflow conclusion
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      - name: Require a green Check run for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/rust.yml/runs?head_sha=${GITHUB_SHA}&status=completed" \
            --jq '.workflow_runs | map({conclusion, html_url})')"

          if [ "$(echo "$runs" | jq 'length')" -eq 0 ]; then
            echo "no completed Check run for ${GITHUB_SHA}" >&2
            echo "push the commit and let that workflow finish before releasing" >&2
            exit 1
          fi

          conclusion="$(echo "$runs" | jq -r '.[0].conclusion')"
          if [ "$conclusion" != "success" ]; then
            echo "Check concluded '${conclusion}' for ${GITHUB_SHA}" >&2
            echo "$runs" | jq -r '.[0].html_url' >&2
            exit 1
          fi

          echo "Check passed for ${GITHUB_SHA}"

      - name: Read the version from Cargo.toml
        id: version
        run: |
          metadata="$(cargo metadata --format-version 1 --no-deps --locked)"

          # `kerilings` pins `kerilings-macros` with `=`, so both always share the workspace version.
          version="$(echo "$metadata" | jq -r '.packages[] | select(.name == "kerilings") | .version')"
          if [ -z "$version" ] || [ "$version" = "null" ]; then
            echo "could not read the package version from Cargo.toml" >&2
            exit 1
          fi

          for crate in kerilings kerilings-macros; do
            package="$(echo "$metadata" | jq --arg name "$crate" '.packages[] | select(.name == $name)')"

            if [ "$(echo "$package" | jq -r '.version')" != "$version" ]; then
              echo "${crate} is not at version ${version}" >&2
              exit 1
            fi

            # `publish = false` in the manifest would make `cargo publish` skip the crate.
            if [ "$(echo "$package" | jq -r '.publish')" != "null" ]; then
              echo "the ${crate} manifest disables publishing; remove 'publish = false'" >&2
              exit 1
            fi
          done

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "preparing to release kerilings $version"

      - name: Refuse to republish an existing version
        run: |
          version='${{ steps.version.outputs.version }}'
          for crate in kerilings kerilings-macros; do
            status="$(curl -sS -o /dev/null -w '%{http_code}' \
              -H 'User-Agent: kerilings release workflow' \
              "https://crates.io/api/v1/crates/${crate}/${version}")"
            case "$status" in
              404) echo "${crate} ${version} is not on crates.io yet" ;;
              200) echo "${crate} ${version} is already published; bump it first" >&2; exit 1 ;;
              *)   echo "unexpected status ${status} from crates.io for ${crate}" >&2; exit 1 ;;
            esac
          done

      - name: Confirm the changelog documents this version
        run: |
          version='${{ steps.version.outputs.version }}'
          if ! grep -qF "## [${version}]" CHANGELOG.md; then
            echo "CHANGELOG.md has no '## [${version}]' section" >&2
            exit 1
          fi

      - name: Review the package contents
        run: |
          cargo package --list --locked -p kerilings-macros
          cargo package --list --locked -p kerilings

      # `--workspace` publishes `kerilings-macros` before `kerilings`, and the dry run resolves the
      # unpublished `kerilings-macros` locally.
      - name: Dry-run the publish
        run: cargo publish --workspace --dry-run --locked

  publish:
    name: Publish ${{ needs.verify.outputs.version }}
    needs: verify
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: write # create the tag and the GitHub release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "${CARGO_REGISTRY_TOKEN}" ]; then
            echo "CARGO_REGISTRY_TOKEN is not set on the crates-io environment" >&2
            exit 1
          fi
          cargo publish --workspace --locked

      - name: Tag the published commit
        run: |
          version='${{ needs.verify.outputs.version }}'
          git tag "v${version}" "${GITHUB_SHA}"
          git push origin "v${version}"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version='${{ needs.verify.outputs.version }}'
          awk -v ver="## [${version}]" '
            index($0, ver) == 1 { inside = 1; next }
            inside && /^## \[/ { exit }
            inside { print }
          ' CHANGELOG.md > "${RUNNER_TEMP}/notes.md"
          prerelease=""
          case "$version" in *-*) prerelease="--prerelease" ;; esac
          gh release create "v${version}" \
            --title "v${version}" \
            --notes-file "${RUNNER_TEMP}/notes.md" \
            ${prerelease}

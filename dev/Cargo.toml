[package]
name = "exercises"
edition = "2024"
rust-version = "1.97"
# Don't publish the exercises on crates.io!
publish = false

[dependencies]
keri-cesr = { version = "0.1.0", features = ["crypto"] }
keri-protocol = "0.2.0"
keri-acdc = "0.2.0"
serde_json = "1.0.151"

[profile.release]
panic = "abort"

[profile.dev]
panic = "abort"

# Key derivation (Argon2) is unusably slow unoptimised.
[profile.dev.package.argon2id-p1]
opt-level = 3
[profile.dev.package.blake2b-192]
opt-level = 3

[lints.rust]
# You shouldn't write unsafe code in kerilings!
unsafe_code = "forbid"
# You don't need unstable features in kerilings and shouldn't rely on them while learning Rust.
unstable_features = "forbid"
# Dead code warnings can't be avoided in some exercises and might distract while learning.
dead_code = "allow"

[lints.clippy]
# You forgot a `todo!()`!
todo = "forbid"
# This can only happen by mistake in kerilings.
empty_loop = "forbid"
# No infinite loops are needed in kerilings.
infinite_loop = "deny"
# You shouldn't leak memory while still learning Rust!
mem_forget = "deny"
# Currently, there are no disallowed methods. This line avoids problems when developing kerilings.
disallowed_methods = "allow"

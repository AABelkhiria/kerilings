format_version = 1

welcome_message = """Welcome to kerilings: KERI, CESR and ACDC in Rust, one small exercise at a time.

1. Each exercise is a Rust file with a `TODO`. Open it in your editor, fix it and save.
   kerilings reruns it and moves on when it compiles and its tests pass.
2. Enter `h` for a hint, `l` for the list of exercises.
3. The exercises use the `keri-cesr`, `keri-protocol` and `keri-acdc` crates. Their docs on
   docs.rs are the reference: https://docs.rs/keri-cesr"""

final_message = """You have built keys, signatures, key events and credentials by hand.
Next, the same workflows against a KERIA agent with signify-rs."""

# INTRO

[[exercises]]
name = "intro1"
dir = "00_intro"
test = false
skip_check_unsolved = true
hint = """
Enter `n` to move on to the next exercise.
You might need to press ENTER after typing `n`."""

[[exercises]]
name = "intro2"
dir = "00_intro"
hint = """
The constants on `DerivationCode` are named after what the material is. Look for the one
named after the Blake3 hash with a 256-bit output."""

# CESR

[[exercises]]
name = "cesr1"
dir = "01_cesr"
hint = """
Count it out: the raw size in bytes becomes `raw * 4 / 3` Base64 characters, rounded up to a
multiple of 4, and the code replaces the padding. Or call `full_size()` in `main` and print it."""

[[exercises]]
name = "cesr2"
dir = "01_cesr"
hint = """
`QualifiedMaterial::new` takes a `DerivationCode` and the raw bytes. Encoding to text is
`qb64()`. Both return a `Result`."""

[[exercises]]
name = "cesr3"
dir = "01_cesr"
hint = """
The text domain is `qb64()`; look for the method named after the binary domain."""

[[exercises]]
name = "cesr4"
dir = "01_cesr"
hint = """
`parsed.consumed()` is the number of characters the primitive took. Slice `rest` from there."""

[[exercises]]
name = "cesr5"
dir = "01_cesr"
hint = """
`Counter::new` takes a `CounterCode` and a count. The constants on `CounterCode` are named after
the group they introduce."""

# SIGNATURES

[[exercises]]
name = "signatures1"
dir = "02_signatures"
hint = """
`signer.verifier()` is the public key. `VerificationKey::verify` takes the raw signature bytes
and the message."""

[[exercises]]
name = "signatures2"
dir = "02_signatures"
hint = """
`VerificationKey::verify` returns a `Result`. `Result` has a method that tells you whether it is
`Ok`."""

[[exercises]]
name = "signatures3"
dir = "02_signatures"
hint = """
A witness's key can never be rotated. Which `KeyTransferability` variant says so?"""

[[exercises]]
name = "signatures4"
dir = "02_signatures"
hint = """
Every signer currently signs at index 0. The loop already computes each signer's position."""

# KEYS

[[exercises]]
name = "keys1"
dir = "03_keys"
hint = """
`Salt::derive_signer` takes the path and a `KeyTransferability`."""

[[exercises]]
name = "keys2"
dir = "03_keys"
hint = """
`Digest::derive` takes a `DigestAlgorithm` and the bytes. Then encode the digest as text."""

[[exercises]]
name = "keys3"
dir = "03_keys"
hint = """
Use the same `Digest::derive` as in the previous exercise. The input is the key's qb64 text:
`VerificationKey` can give it to you as bytes directly."""

[[exercises]]
name = "keys4"
dir = "03_keys"
hint = """
`Decrypter::from_signer` and then `decrypt_salt`. It returns a `Result`; `.ok()` turns that into
an `Option`."""

# SAIDS

[[exercises]]
name = "said1"
dir = "04_said"
hint = """
`Sad::insert` adds a field at the end, so insert `d` before the other fields. Its value is the
empty string: `Said::compute` replaces it with the placeholder and then with the SAID."""

[[exercises]]
name = "said2"
dir = "04_said"
hint = """
`Sad::get_text("d")` returns the claimed SAID, `Said::from_qb64` parses it, and `Said::verify`
takes the data, the label `"d"` and `SaidVerification::strict()`. Turn each failure into `false`,
for example with `let ... else`."""

[[exercises]]
name = "said3"
dir = "04_said"
hint = """
The size is the six characters after `KERI10JSON`, at byte positions 10 to 15. `str::get(10..16)`
returns `None` when the string is too short, and `usize::from_str_radix(digits, 16)` parses
hexadecimal."""

# INCEPTION

[[exercises]]
name = "inception1"
dir = "05_inception"
hint = """
`KeyTransferability` has two variants. A non-transferable key gets the `B` code."""

[[exercises]]
name = "inception2"
dir = "05_inception"
hint = """
`Digest::derive` takes a `DigestAlgorithm` and the bytes to hash. The bytes are the key's qb64
text: `key.qb64()` returns it as a `String`."""

[[exercises]]
name = "inception3"
dir = "05_inception"
hint = """
`InceptionBuilder::prefix_derivation` takes a `PrefixDerivation`. The self-addressing one is named
after its digest algorithm."""

[[exercises]]
name = "inception4"
dir = "05_inception"
hint = """
Key 0 alone must reach 1. Keys 1 and 2 together must reach 1, but neither alone. Weights are
fractions written as text, such as "1/2", or "1" for a whole."""

# ROTATION

[[exercises]]
name = "rotation1"
dir = "06_rotation"
hint = """
`KeyEvent::said` returns an event's SAID. Inception is sequence number 0, so the first event
after it is 1."""

[[exercises]]
name = "rotation2"
dir = "06_rotation"
hint = """
`previous.serialized().next_key_digests()` returns the committed digests. Compute each new key's
commitment the same way as in `inception2`, then use `Iterator::all` and `contains`."""

[[exercises]]
name = "rotation3"
dir = "06_rotation"
hint = """
Insert one field, `d`, holding the qb64 of `document`."""

[[exercises]]
name = "rotation4"
dir = "06_rotation"
hint = """
Start from `Sad::new()` and insert `i` from `event.identifier().qb64()`, `s` from
`format!("{:x}", event.sequence_number())`, and `d` from `event.said().qb64()`."""

# ATTACHMENTS

[[exercises]]
name = "attachments1"
dir = "07_attachments"
hint = """
`Signer::sign_indexed` takes the bytes to sign, `event.raw()`, and a `SignaturePlacement`. The
header comment names the placement."""

[[exercises]]
name = "attachments2"
dir = "07_attachments"
hint = """
`SerializedEvent::parse` reads the event and `verification_keys` returns its `k` list. For each
signature, `signature.index()` picks the key (convert it with `usize::try_from`), and
`key.verify(signature.raw(), event)` checks it. `keys.get(index)` avoids a panic on a bad index."""

[[exercises]]
name = "attachments3"
dir = "07_attachments"
hint = """
`Signer` has two signing methods. A receipt uses the one that takes only the bytes to sign."""

[[exercises]]
name = "attachments4"
dir = "07_attachments"
hint = """
Build the `SignatureSeal::Event` variant from the inception event: its identifier, its sequence
number wrapped in `SequenceNumber::new`, and its SAID. `KeyEvent` has an accessor for each."""

# CREDENTIALS

[[exercises]]
name = "credentials1"
dir = "08_credentials"
hint = """
`CredentialAttributes` is a builder: each method returns the block with one more field. Look for
the method that writes the subject's identifier into the block's `i`. It takes the holder's
`IdentifierPrefix` by reference and returns a `Result`."""

[[exercises]]
name = "credentials2"
dir = "08_credentials"
hint = """
`Credential` has one accessor per SAID. `said` is the container's `d`; the other one is named
after the block it digests."""

[[exercises]]
name = "credentials3"
dir = "08_credentials"
hint = """
`CredentialAttributes` keeps fields in the order its methods are called, and the SAID is a digest
of that exact order. The test expects the labels `d`, `i`, `dt`, `LEI`: call `timestamp` before
`text`."""

[[exercises]]
name = "credentials4"
dir = "08_credentials"
hint = """
The `vcp` event is a `KeyEvent`, and every key event knows the identifier it belongs to. That
accessor returns a reference, while `RegistryIdentifier::from` takes an owned
`IdentifierPrefix`."""

# ISSUANCE

[[exercises]]
name = "issuance1"
dir = "09_issuance"
hint = """
`IssuanceEvent` has a constructor that takes the credential itself and reads everything it needs
from it (its SAID, its registry, its timestamp). It returns a `Result`."""

[[exercises]]
name = "issuance2"
dir = "09_issuance"
hint = """
The issuer's latest event is its inception, and `KeyEvent` can tell you its own sequence number.
An inception is always the first event of a key event log."""

[[exercises]]
name = "issuance3"
dir = "09_issuance"
hint = """
`Signer` has two signing methods. A key event's controller signature is the indexed one, and it
takes the bytes to sign (`KeyEvent::raw`) and a `SignaturePlacement`."""

[[exercises]]
name = "issuance4"
dir = "09_issuance"
hint = """
A transaction event log is a hash chain: each event names the SAID of the one before it. Before
the `rev`, the credential's log holds exactly one event."""

# IPEX

[[exercises]]
name = "ipex1"
dir = "10_ipex"
hint = """
Every IPEX step names the step before it by its SAID. The agree answers the offer, and
`IpexMessage` has an accessor for its own SAID."""

[[exercises]]
name = "ipex2"
dir = "10_ipex"
hint = """
`Disclosure` has two constructors. One takes every artifact and attachment separately; the
other derives them all from `IssuanceArtifacts`. Pass the artifacts by reference."""

[[exercises]]
name = "ipex3"
dir = "10_ipex"
hint = """
`IpexEnvelope::new` takes the sender first and the recipient second. The holder admits a
credential the issuer granted."""

[[exercises]]
name = "ipex4"
dir = "10_ipex"
hint = """
Sign exactly what travels: `IpexMessage::raw`. The holder has one key, so its indexed signature
goes at `SignaturePlacement::both_lists(0)`, as the issuer's did in issuance3."""
